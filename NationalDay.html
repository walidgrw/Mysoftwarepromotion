	<style>

		/* Root Variables */
		:root {
			--primary-color: #008080;
			--secondary-color: #005F5F;
			--background-color: #F0F7F7;
			--text-color: #333;
			--white: #ffffff;
			--shadow: rgba(0, 0, 0, 0.1);
		}

		/* General Styles */
		body {
			background-color: var(--background-color);
			color: var(--text-color);
			line-height: 1.6;
		}

		.container {
			width: 90%;
			max-width: 1200px;
			margin: auto;
			padding: 20px;
		}

		/* Improved Navigation Bar */
		/* Navigation Bar */
.navbar {
    background:linear-gradient(135deg, #41B6E6 0%, #005F5F 100%);
    padding: 15px 20px;
    box-shadow: 0px 4px 6px var(--shadow);
    position: sticky;
    top: 0;
    width: 100%;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
}

/* Logo */
.logo-container {
    display: flex;
    align-items: center;
}

.logo {
    width: 100px;
    height: auto;
    margin-right: 15px;
}

/* Navigation Menu */
.nav-container {
    position: relative;
}

.nav-menu {
    list-style: none;
    display: flex;
    gap: 30px;
    align-items: center;
    margin: 0;
    position: relative;
}

.nav-menu li {
    display: inline-block;
}

.nav-menu li a {
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 15px;
    text-transform: uppercase;
    position: relative;
}

/* Animated Hover Effect */
.nav-menu a::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 3px;
    bottom: 0;
    left: 0;
    background-color: rgb(72, 239, 97);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease-in-out;
}

.nav-menu a:hover::before {
    transform: scaleX(1);
    transform-origin: left;
}

/* Moving Animation */
.animation {
    position: absolute;
    height: 100%;
    top: 0;
    z-index: 0;
    transition: all .5s ease 0s;
    border-radius: 8px;
}

.nav-container a:nth-child(1):hover ~ .animation {
    width: 100px;
    left: 0;
    background-color: #1abc9c;
}
.nav-container a:nth-child(2):hover ~ .animation {
    width: 110px;
    left: 100px;
    background-color: #e74c3c;
}
.nav-container a:nth-child(3):hover ~ .animation {
    width: 100px;
    left: 210px;
    background-color: #3498db;
}
.nav-container a:nth-child(4):hover ~ .animation {
    width: 160px;
    left: 310px;
    background-color: #9b59b6;
}
.nav-container a:nth-child(5):hover ~ .animation {
    width: 120px;
    left: 470px;
    background-color: #e67e22;
}

/* Social Media Icons */
.social-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.social-container p {
    color: white;
    font-weight: bold;
    margin-right: 10px;
    font-size: 0.9rem;
}

.social-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 0;
}

.social-icons a {
    display: inline-block;
}

.social-icons img {
    width: 25px;
    height: auto;
    transition: transform 0.3s ease-in-out;
}

.social-icons img:hover {
    transform: scale(1.2);
}


.nav-menu li a:hover {
    text-decoration: underline;
}


	body {

	svg {
		display: block;
		margin: 3rem auto;
		font-family: Caveat, sans-serif;
		background-color: #B7E5FF;
	}
	#wmhd {
		font-weight: bold;
		font-size: 72px;
		fill: #282828;
	}
	#date {
		font-size: 48px;
		fill: #278927;
	}
    #fronthand, #rearhand, #claspedhands, #ribbon, #wmhd, #date {
    	opacity: 0;
	}

    @keyframes infromleft {
    from {
        transform: translate(-100%);
        opacity: 1;
    }
    to {
        transform: translate(0%);
        opacity: 1;
    }
}

#fronthand {
    animation-name: infromleft;
    animation-duration: 1.5s;
    animation-timing-function: ease-out;
}
@keyframes infromright {
		from {
			transform: translate(100%);
			opacity: 1;
		}
		to {
			transform: translate(0%);
			opacity: 1;
		}
	}

#rearhand {
		animation-name: infromright;
		animation-duration: 1.5s;
		animation-timing-function: ease-out;
	}

    @keyframes instantappear {
		from {
			opacity: 1;
		}
		to {
			opacity: 1;
		}
	}
    #claspedhands {
		animation-name: instantappear;
		animation-duration: 1s;
		animation-delay: 1.5s;
		animation-fill-mode: forwards;
	}
    @keyframes fadein {
		from {
			opacity: 0;
		}
		to {
			opacity: 1;
		}
	}
    #ribbon {
		animation-name: fadein;
		animation-duration: 0.75s;
		animation-delay: 1.75s;
		animation-fill-mode: forwards;
	}
    #wmhd {
		font-weight: bold;
		font-size: 72px;
		fill: #282828;
		animation-name: fadein;
		animation-duration: 0.75s;
		animation-delay: 2.25s;
		animation-fill-mode: forwards;
	}
    #date {
		font-size: 48px;
		fill: #278927;
		animation-name: fadein;
		animation-duration: 0.75s;
		animation-delay: 2.75s;
		animation-fill-mode: forwards;
	}
